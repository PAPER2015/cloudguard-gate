# CloudGuard 정책 게이트
# infra/ 폴더의 Terraform 파일이 바뀌어 GitHub에 올라오면 자동으로 실행됩니다.
#   1) 보안 검사 (policy-gate)  → BLOCK이면 여기서 빨간 X로 멈춤
#   2) 모의 배포 (mock-deploy)   → 검사를 통과했을 때만 실행됨 (실제 클라우드 배포 없음)

name: CloudGuard Policy Gate

on:
  push:
    paths:
      - "infra/**"
      - "policy_gate.py"
      - ".github/workflows/policy-gate.yml"
  pull_request:
    paths:
      - "infra/**"
      - "policy_gate.py"
  workflow_dispatch:   # Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능

jobs:
  policy-gate:
    name: 1. 보안 정책 검사
    runs-on: ubuntu-latest
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 보안 검사 실행 (BLOCK이면 여기서 실패)
        run: python policy_gate.py infra --json results.json

      - name: 검사 결과 요약 표 만들기
        if: always()   # 검사가 실패해도 요약은 항상 만든다
        run: python summary.py results.json >> "$GITHUB_STEP_SUMMARY"

      - name: 검사 결과 JSON 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-gate-results
          path: results.json

  mock-deploy:
    name: 2. 모의 배포
    needs: policy-gate   # 1번이 성공해야만 실행됨 = 이것이 "게이트"
    runs-on: ubuntu-latest
    steps:
      - name: 모의 배포 (실제 클라우드에는 아무것도 만들지 않음)
        run: |
          echo "보안 정책 검사를 통과했습니다."
          echo "실제 프로젝트라면 이 자리에서 terraform apply 로 배포합니다."
          echo "## ✅ 모의 배포 완료" >> "$GITHUB_STEP_SUMMARY"
